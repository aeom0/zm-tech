# CI básico del monorepo — corre en cada PR y push a main.
# Un check en rojo bloquea el merge (branch protection en GitHub → Settings).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: lint + typecheck (todos los workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm check:types

  build-web:
    name: build (geemastudio-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true

      - run: pnpm install --frozen-lockfile

      - name: Build geemastudio-web
        working-directory: apps/geemastudio-web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: pnpm build
