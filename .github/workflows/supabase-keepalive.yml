# Ping diario al hub Supabase (llacowjutjfefboqgfnj, plan Free) para que no se
# pause por inactividad (Supabase pausa proyectos Free tras 7 días sin tráfico API).
#
# Secretos del repo (Settings → Secrets and variables → Actions):
#   EXPO_PUBLIC_SUPABASE_ANON_KEY — ya existe (reusado de repmax-ota.yml), anon key del hub
name: Supabase Keepalive

on:
  schedule:
    - cron: '0 12 * * *' # 12:00 UTC todos los días
  workflow_dispatch: {}

jobs:
  ping:
    name: ping hub Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Check secret
        env:
          ANON: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$ANON" ]; then
            echo "Falta el secreto EXPO_PUBLIC_SUPABASE_ANON_KEY. Sin eso el ping no autentica contra el hub."
            exit 1
          fi

      - name: Ping REST endpoint
        env:
          ANON: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://llacowjutjfefboqgfnj.supabase.co/rest/v1/" \
            -H "apikey: $ANON" \
            -H "Authorization: Bearer $ANON")
          echo "REST status: $status"
          if [ "$status" -ge 400 ]; then
            echo "El hub respondió con error ($status)."
            exit 1
          fi
