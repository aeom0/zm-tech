# Ping diario al hub Supabase (llacowjutjfefboqgfnj, plan Free) para que no se
# pause por inactividad.
#
# Importante: Supabase solo cuenta "user database activity" (queries a Postgres).
# /storage/v1/status responde 200 pero NO toca la BD → no evita la pausa.
# /rest/v1/ (raíz) exige service_role → 401 con anon. Hay que hacer SELECT real.
#
# Secretos del repo (Settings → Secrets and variables → Actions):
#   EXPO_PUBLIC_SUPABASE_ANON_KEY — anon/publishable key del hub llaco…
name: Supabase Keepalive

on:
  schedule:
    # Dos veces al día: margen si un run falla o GitHub atrasa el cron
    - cron: '0 12 * * *' # 12:00 UTC
    - cron: '0 0 * * *' # 00:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    name: ping hub Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Check secret
        env:
          ANON: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$ANON" ]; then
            echo "Falta el secreto EXPO_PUBLIC_SUPABASE_ANON_KEY."
            exit 1
          fi

      - name: Ping REST (SELECT real a Postgres)
        env:
          ANON: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          BASE: https://llacowjutjfefboqgfnj.supabase.co
        run: |
          fail=0
          for path in \
            "contacts?select=id&limit=1" \
            "quote_leads?select=id&limit=1"
          do
            status=$(curl -sS -o /tmp/ka-body.txt -w "%{http_code}" \
              "$BASE/rest/v1/$path" \
              -H "apikey: $ANON" \
              -H "Authorization: Bearer $ANON" \
              -H "Accept: application/json")
            echo "GET /$path → $status"
            if [ "$status" -ge 400 ]; then
              echo "body: $(head -c 300 /tmp/ka-body.txt)"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "El hub no recibió queries válidas; revisa la anon key del secreto."
            exit 1
          fi
          echo "OK — actividad de BD registrada."
