<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RepMAX — Onboarding tap-through</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --frame: #111;
      --accent: #ff6b00;
      --text: #f5f5f5;
      --muted: #9e9e9e;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      gap: 20px;
      padding: 24px 16px 40px;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, #24160f 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
      text-align: center;
    }

    h1 span { color: var(--accent); }

    .stage {
      position: relative;
      width: min(390px, 100%);
      aspect-ratio: 390 / 844;
      border-radius: 28px;
      overflow: hidden;
      background: #0d0d0d;
      box-shadow:
        0 0 0 1px #2e2e2e,
        0 24px 64px rgba(0, 0, 0, 0.55),
        0 0 40px rgba(255, 107, 0, 0.08);
    }

    .screen {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 180ms var(--ease), transform 180ms var(--ease);
      pointer-events: none;
    }

    .screen.is-active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      z-index: 1;
    }

    .screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .hit {
      position: absolute;
      z-index: 2;
      cursor: pointer;
      border: 0;
      background: transparent;
      border-radius: 12px;
    }

    .hit:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .hit--full { inset: 0; }

    .hit--footer {
      left: 5%;
      right: 5%;
      bottom: 3.5%;
      height: 7.5%;
    }

    .hit--mid {
      left: 5%;
      right: 5%;
      top: 28%;
      bottom: 22%;
    }

    .hit--secondary {
      left: 5%;
      right: 5%;
      bottom: 11%;
      height: 7%;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .controls button {
      appearance: none;
      border: 1px solid #2e2e2e;
      background: #1a1a1a;
      color: var(--text);
      font: 600 13px/1 Inter, system-ui, sans-serif;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    .controls button:hover { border-color: var(--accent); }

    .step {
      font-size: 12px;
      color: var(--muted);
      min-width: 88px;
      text-align: center;
    }

    .hint {
      max-width: 390px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .screen {
        transition: opacity 1ms linear;
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <h1>RepMAX onboarding · <span>tap-through</span></h1>

  <div class="stage" id="stage" aria-live="polite">
    <!-- Screens injected by JS -->
  </div>

  <div class="controls">
    <button type="button" id="prev" aria-label="Pantalla anterior">Anterior</button>
    <div class="step" id="stepLabel">01 / 07</div>
    <button type="button" id="next" aria-label="Pantalla siguiente">Siguiente</button>
    <button type="button" id="restart">Reiniciar</button>
  </div>

  <p class="hint" id="hint">Splash avanza solo. En el resto, toca la zona activa o usa los controles.</p>

  <script>
    const SCREENS = [
      {
        id: "onb01",
        file: "onb01.png",
        label: "Splash",
        hint: "Auto-avanza en ~1.1s (fade de marca).",
        autoMs: 1100,
        hits: [{ className: "hit--full", go: 1, label: "Saltar splash" }],
      },
      {
        id: "onb02",
        file: "onb02.png",
        label: "País",
        hint: "Toca Venezuela u otro país → Vehículos.",
        hits: [{ className: "hit--mid", go: 2, label: "Elegir país" }],
      },
      {
        id: "onb03",
        file: "onb03.png",
        label: "Vehículos",
        hint: "Toca una card (Carros / Motos / Ambos) → Negocio.",
        hits: [{ className: "hit--mid", go: 3, label: "Elegir vehículo" }],
      },
      {
        id: "onb04",
        file: "onb04.png",
        label: "Negocio",
        hint: "Toca tipo de negocio → Tema.",
        hits: [{ className: "hit--mid", go: 4, label: "Elegir negocio" }],
      },
      {
        id: "onb05",
        file: "onb05.png",
        label: "Tema",
        hint: "Toca Continuar (footer) → Preview.",
        hits: [{ className: "hit--footer", go: 5, label: "Continuar" }],
      },
      {
        id: "onb06",
        file: "onb06.png",
        label: "Preview",
        hint: "Toca «Se ve brutal, continuar» → Decisión.",
        hits: [{ className: "hit--footer", go: 6, label: "Continuar" }],
      },
      {
        id: "onb07",
        file: "onb07.png",
        label: "Decisión",
        hint: "Cuenta o Demo → fin del onboarding (Auth).",
        hits: [
          { className: "hit--footer", go: 0, label: "Crear cuenta (reinicia demo)" },
          { className: "hit--secondary", go: 0, label: "Explorar demo (reinicia)" },
        ],
      },
    ];

    const stage = document.getElementById("stage");
    const stepLabel = document.getElementById("stepLabel");
    const hintEl = document.getElementById("hint");
    let index = 0;
    let autoTimer = null;

    function build() {
      stage.innerHTML = "";
      SCREENS.forEach((screen, i) => {
        const wrap = document.createElement("div");
        wrap.className = "screen" + (i === 0 ? " is-active" : "");
        wrap.dataset.index = String(i);
        wrap.setAttribute("role", "img");
        wrap.setAttribute("aria-label", screen.label);

        const img = document.createElement("img");
        img.src = screen.file;
        img.alt = "ONB-" + String(i + 1).padStart(2, "0") + " " + screen.label;
        wrap.appendChild(img);

        screen.hits.forEach((hit) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "hit " + hit.className;
          btn.setAttribute("aria-label", hit.label);
          btn.addEventListener("click", () => goTo(hit.go));
          wrap.appendChild(btn);
        });

        stage.appendChild(wrap);
      });
    }

    function clearAuto() {
      if (autoTimer !== null) {
        clearTimeout(autoTimer);
        autoTimer = null;
      }
    }

    function goTo(next) {
      clearAuto();
      const screens = stage.querySelectorAll(".screen");
      screens[index]?.classList.remove("is-active");
      index = ((next % SCREENS.length) + SCREENS.length) % SCREENS.length;
      screens[index]?.classList.add("is-active");
      const screen = SCREENS[index];
      stepLabel.textContent = String(index + 1).padStart(2, "0") + " / 07 · " + screen.label;
      hintEl.textContent = screen.hint;
      if (screen.autoMs) {
        autoTimer = setTimeout(() => goTo(index + 1), screen.autoMs);
      }
    }

    document.getElementById("prev").addEventListener("click", () => goTo(index - 1));
    document.getElementById("next").addEventListener("click", () => goTo(index + 1));
    document.getElementById("restart").addEventListener("click", () => goTo(0));

    build();
    goTo(0);
  </script>
</body>
</html>
