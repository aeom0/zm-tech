<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <rect width="400" height="100" fill="#0F0F0F"/>

  <defs>
    <linearGradient id="trapCenter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1.00"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.60"/>
    </linearGradient>
    <!--
      Símbolo: 80×72px, escalado desde viewBox 120×120 del original.
      El diamante en el original ocupa x:14.5–105.5, y:26.5–97.5
      Lo posicionamos centrado verticalmente en 100px: y_offset = (100-72)/2 = 14
      x_offset = 10 (margen izq)
      Escala: sx = 80/91 ≈ 0.8791, sy = 72/71 ≈ 1.0141
      Transformación aplicada como matrix(sx,0,0,sy, tx, ty)
      tx = 10 - 14.5*0.8791 = 10 - 12.746 = -2.746
      ty = 14 - 26.5*1.0141 = 14 - 26.874 = -12.874

      clipHoriz original: y=27.1 → y_clip = 27.1*1.0141 - 12.874 = 14.63
      Aplicado via clipPath con rect desde y=14.63
    -->
    <clipPath id="clipHoriz">
      <rect x="0" y="14.63" width="400" height="85.37"/>
    </clipPath>
  </defs>

  <g transform="matrix(0.8791,0,0,1.0141,-2.746,-12.874)">
    <!-- CORONA IZQUIERDA -->
    <path d="M 35,26.5 L 14.5,43.5 L 45.25,43.5 L 47,26.5"
          fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.90"
          stroke-linecap="butt" clip-path="url(#clipHoriz)"/>

    <!-- CORONA CENTRAL -->
    <path d="M 47,27.1 L 73,27.1 L 74.75,44.1 L 45.25,44.1 Z"
          fill="url(#trapCenter)"/>

    <!-- CORONA DERECHA -->
    <path d="M 73,26.5 L 74.75,43.5 L 105.5,43.5 L 85,26.5"
          fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.35"
          stroke-linecap="butt" clip-path="url(#clipHoriz)"/>

    <!-- PABELLÓN IZQUIERDO -->
    <path d="M 14.5,45.5 L 45.25,45.5 L 60,97.5 Z"
          fill="#FFFFFF" fill-opacity="0.70"/>

    <!-- PABELLÓN DERECHO -->
    <path d="M 74.75,45.5 L 105.5,45.5 L 60,97.5 Z"
          fill="#FFFFFF" fill-opacity="0.18"/>
  </g>

  <!-- WORDMARK: un solo <text> con dos tspan para que queden pegados -->
  <text x="106" y="57"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="28" fill="#FFFFFF"><tspan font-weight="600">Salon</tspan><tspan font-weight="300" fill-opacity="0.75">Pro</tspan></text>

  <!-- TAGLINE centrada bajo el wordmark -->
  <text x="172" y="74"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="9" fill="#FFFFFF" fill-opacity="0.30"
        letter-spacing="3" text-anchor="middle">GESTIÓN INTELIGENTE</text>
</svg>
