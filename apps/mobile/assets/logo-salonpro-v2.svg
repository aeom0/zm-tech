<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <rect width="120" height="120" fill="#0F0F0F"/>

  <defs>
    <linearGradient id="trapCenter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1.00"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.60"/>
    </linearGradient>
    <!-- clipPath ajustado: y=9 para que el apex en (60,10) quede completamente visible -->
    <clipPath id="clipHoriz">
      <rect x="0" y="9" width="120" height="111"/>
    </clipPath>
  </defs>

  <!-- TRIÁNGULO DE PERSPECTIVA IZQUIERDO
       Vértices: apex (60,10) → esquina sup-izq trapecio (47,27.1) → punto interior corona izq (45.25,43.5)
       Faceta de fondo/sombra — sugiere profundidad entre corona y trapecio -->
  <path d="M 60,10 L 47,27.1 L 45.25,43.5 Z"
        fill="#FFFFFF" fill-opacity="0.15"
        stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.20"/>

  <!-- TRIÁNGULO DE PERSPECTIVA DERECHO
       Vértices: apex (60,10) → esquina sup-der trapecio (73,27.1) → punto interior corona der (74.75,43.5)
       Simétrico al izquierdo -->
  <path d="M 60,10 L 73,27.1 L 74.75,43.5 Z"
        fill="#FFFFFF" fill-opacity="0.15"
        stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.20"/>

  <!-- CORONA IZQUIERDA — triángulo cerrado con apex en (60,10)
       Antes: stroke abierto M 35,26.5 L 14.5,43.5 L 45.25,43.5 L 47,26.5
       Ahora: triángulo completo convergiendo en el apex -->
  <path d="M 60,10 L 14.5,43.5 L 45.25,43.5 Z"
        fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.90"
        stroke-linejoin="miter"/>

  <!-- CORONA CENTRAL — trapecio con linearGradient (sin cambios) -->
  <path d="M 47,27.1 L 73,27.1 L 74.75,44.1 L 45.25,44.1 Z"
        fill="url(#trapCenter)"/>

  <!-- CORONA DERECHA — triángulo cerrado con apex en (60,10)
       Antes: stroke abierto M 73,26.5 L 74.75,43.5 L 105.5,43.5 L 85,26.5
       Ahora: triángulo completo convergiendo en el apex -->
  <path d="M 60,10 L 74.75,43.5 L 105.5,43.5 Z"
        fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.35"
        stroke-linejoin="miter"/>

  <!-- PABELLÓN IZQUIERDO — luz rebotada (sin cambios) -->
  <path d="M 14.5,45.5 L 45.25,45.5 L 60,97.5 Z"
        fill="#FFFFFF" fill-opacity="0.70"/>

  <!-- PABELLÓN CENTRAL — vacío, sombra profunda (sin cambios) -->

  <!-- PABELLÓN DERECHO — casi negro (sin cambios) -->
  <path d="M 74.75,45.5 L 105.5,45.5 L 60,97.5 Z"
        fill="#FFFFFF" fill-opacity="0.18"/>

</svg>
